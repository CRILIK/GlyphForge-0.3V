name: Publish signed GlyphForge release
on:
  push:
    tags: ['v*.*.*']
    branches: [main]
    paths: ['app/build.gradle', '.github/workflows/release-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: glyphforge-signed-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Determine release version
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GF_KEYSTORE_B64: ${{ secrets.GF_KEYSTORE_B64 }}
          GF_KEYSTORE_PASSWORD: ${{ secrets.GF_KEYSTORE_PASSWORD }}
          GF_KEY_ALIAS: ${{ secrets.GF_KEY_ALIAS }}
          GF_KEY_PASSWORD: ${{ secrets.GF_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n "s/.*versionName '\([0-9.]*\)'.*/\1/p" app/build.gradle)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          TAG="v$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo "::error::Tag does not match versionName"; exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already published"; echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [[ -z "$GF_KEYSTORE_B64" || -z "$GF_KEYSTORE_PASSWORD" || -z "$GF_KEY_ALIAS" || -z "$GF_KEY_PASSWORD" ]]; then
            echo "::warning::Signing not configured; run Setup-Release-Signing.ps1 locally."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" || "$GITHUB_REF_TYPE" == "tag" ]]; then exit 1; fi
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Require successful QA and emulator run for this commit
        if: steps.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            QA=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/qa.yml/runs?head_sha=$GITHUB_SHA&per_page=5" --jq '.workflow_runs[0].conclusion // ""')
            BUILD=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build-apk.yml/runs?head_sha=$GITHUB_SHA&per_page=5" --jq '.workflow_runs[0].conclusion // ""')
            if [[ "$QA" == "success" && "$BUILD" == "success" ]]; then exit 0; fi
            if [[ "$QA" =~ ^(failure|cancelled|timed_out)$ || "$BUILD" =~ ^(failure|cancelled|timed_out)$ ]]; then
              echo "::error::QA or emulator failed on this commit"; exit 1
            fi
            echo "QA=$QA; build=$BUILD; checks not yet complete"
            sleep 15
          done
          echo "::error::No successful QA and emulator run for this commit. Run both workflows before releasing."
          exit 1
      - name: Require stable release signing secrets
        if: steps.plan.outputs.publish == 'true'
        env:
          GF_KEYSTORE_B64: ${{ secrets.GF_KEYSTORE_B64 }}
          GF_KEYSTORE_PASSWORD: ${{ secrets.GF_KEYSTORE_PASSWORD }}
          GF_KEY_ALIAS: ${{ secrets.GF_KEY_ALIAS }}
          GF_KEY_PASSWORD: ${{ secrets.GF_KEY_PASSWORD }}
        run: |
          test -n "$GF_KEYSTORE_B64" && test -n "$GF_KEYSTORE_PASSWORD" && test -n "$GF_KEY_ALIAS" && test -n "$GF_KEY_PASSWORD" || (echo 'Configure 4 release signing secrets (see docs/RELEASES.md)' && exit 1)
      - name: Install SDK
        if: steps.plan.outputs.publish == 'true'
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Get Nothing SDK
        if: steps.plan.outputs.publish == 'true'
        run: |
          mkdir -p app/libs
          curl --fail --location --retry 3 --output app/libs/glyph-matrix-sdk-2.0.aar https://raw.githubusercontent.com/Nothing-Developer-Programme/GlyphMatrix-Developer-Kit/999b1143a6bff0dd79db11d21b92c15c56a346b1/glyph-matrix-sdk-2.0.aar
      - name: Build unsigned release
        if: steps.plan.outputs.publish == 'true'
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.13-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.13/bin/gradle assembleRelease --no-daemon
      - name: Sign release using private key
        if: steps.plan.outputs.publish == 'true'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          GF_KEYSTORE_B64: ${{ secrets.GF_KEYSTORE_B64 }}
          GF_KEYSTORE_PASSWORD: ${{ secrets.GF_KEYSTORE_PASSWORD }}
          GF_KEY_ALIAS: ${{ secrets.GF_KEY_ALIAS }}
          GF_KEY_PASSWORD: ${{ secrets.GF_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f "$RUNNER_TEMP/release.jks"' EXIT
          printf '%s' "$GF_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$GF_KEY_ALIAS" --ks-pass env:GF_KEYSTORE_PASSWORD --key-pass env:GF_KEY_PASSWORD --out "GlyphForge-${TAG}.apk" "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "GlyphForge-${TAG}.apk"
          sha256sum "GlyphForge-${TAG}.apk" > "GlyphForge-${TAG}.sha256"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "GlyphForge-${TAG}.apk" | tee release-permissions.txt
          if grep -E "android.permission.(REQUEST_INSTALL_PACKAGES|INSTALL_PACKAGES|READ_SMS|READ_CONTACTS|READ_CALL_LOG)" release-permissions.txt; then exit 1; fi
          rm -f "$RUNNER_TEMP/release.jks"
      - name: Ensure previous release can be upgraded without uninstall
        if: steps.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          OLD=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // ""')
          if [[ -z "$OLD" ]]; then echo "First signed release"; exit 0; fi
          mkdir -p "$RUNNER_TEMP/previous"
          gh release download "$OLD" --pattern "GlyphForge-$OLD.apk" --dir "$RUNNER_TEMP/previous"
          OLD_APK="$RUNNER_TEMP/previous/GlyphForge-$OLD.apk"
          NEW_APK="GlyphForge-$TAG.apk"
          SIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          OLD_CERT=$("$SIGNER" verify --print-certs "$OLD_APK" | grep 'certificate SHA-256 digest:' | sort)
          NEW_CERT=$("$SIGNER" verify --print-certs "$NEW_APK" | grep 'certificate SHA-256 digest:' | sort)
          [[ -n "$OLD_CERT" && "$OLD_CERT" == "$NEW_CERT" ]] || { echo "::error::Signing key changed; release blocked"; exit 1; }
          OLD_CODE=$("$AAPT" dump badging "$OLD_APK" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
          NEW_CODE=$("$AAPT" dump badging "$NEW_APK" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
          [[ "$OLD_CODE" =~ ^[0-9]+$ && "$NEW_CODE" =~ ^[0-9]+$ && "$NEW_CODE" -gt "$OLD_CODE" ]] || { echo "::error::versionCode must increase"; exit 1; }
      - name: Publish release on GitHub
        if: steps.plan.outputs.publish == 'true'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${TAG}" "GlyphForge-${TAG}.apk" "GlyphForge-${TAG}.sha256" --target "$GITHUB_SHA" --title "GlyphForge ${TAG}" --generate-notes
