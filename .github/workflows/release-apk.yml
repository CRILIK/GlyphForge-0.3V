name: Publish signed GlyphForge release
on:
  workflow_dispatch:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Require stable release signing secrets
        env:
          GF_KEYSTORE_B64: ${{ secrets.GF_KEYSTORE_B64 }}
          GF_KEYSTORE_PASSWORD: ${{ secrets.GF_KEYSTORE_PASSWORD }}
          GF_KEY_ALIAS: ${{ secrets.GF_KEY_ALIAS }}
          GF_KEY_PASSWORD: ${{ secrets.GF_KEY_PASSWORD }}
        run: |
          test -n "$GF_KEYSTORE_B64" && test -n "$GF_KEYSTORE_PASSWORD" && test -n "$GF_KEY_ALIAS" && test -n "$GF_KEY_PASSWORD" || (echo 'Configure 4 release signing secrets (see docs/RELEASES.md)' && exit 1)
      - name: Install SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Get Nothing SDK
        run: |
          mkdir -p app/libs
          curl --fail --location --retry 3 --output app/libs/glyph-matrix-sdk-2.0.aar https://raw.githubusercontent.com/Nothing-Developer-Programme/GlyphMatrix-Developer-Kit/main/glyph-matrix-sdk-2.0.aar
      - name: Build unsigned release
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.13-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.13/bin/gradle assembleRelease --no-daemon
      - name: Sign release using private key
        env:
          GF_KEYSTORE_B64: ${{ secrets.GF_KEYSTORE_B64 }}
          GF_KEYSTORE_PASSWORD: ${{ secrets.GF_KEYSTORE_PASSWORD }}
          GF_KEY_ALIAS: ${{ secrets.GF_KEY_ALIAS }}
          GF_KEY_PASSWORD: ${{ secrets.GF_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GF_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$GF_KEY_ALIAS" --ks-pass env:GF_KEYSTORE_PASSWORD --key-pass env:GF_KEY_PASSWORD --out "GlyphForge-${GITHUB_REF_NAME}.apk" "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "GlyphForge-${GITHUB_REF_NAME}.apk"
          rm -f "$RUNNER_TEMP/release.jks"
      - name: Publish release on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "GlyphForge-${GITHUB_REF_NAME}.apk" --title "GlyphForge ${GITHUB_REF_NAME}" --generate-notes
