plugins { id 'com.android.application' }

android {
    namespace 'com.example.glyphforge'
    compileSdk 36

    defaultConfig {
        applicationId 'com.example.glyphforge'
        minSdk 33
        targetSdk 35
        versionCode 6
        versionName '0.4.2'
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    // Optional official Nothing SDK. Download AAR from developer repository.
    // APK without it can run editor but cannot drive real Glyph Matrix.
    if (file('libs/glyph-matrix-sdk-2.0.aar').exists()) {
        implementation files('libs/glyph-matrix-sdk-2.0.aar')
    }
}
